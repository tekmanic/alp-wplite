user xyz;
worker_processes auto;
worker_rlimit_nofile 8192; # should be bigger than worker_connections
pid /run/nginx.pid;

events {
    use epoll;
    worker_connections 8000;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 30; # longer values are better for each ssl client, but take up a worker connection longer
    types_hash_max_size 2048;
    server_tokens off;

    # Timeouts to slow down slowloris-style abuse
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 12s;

    # Rate limiting (per client IP). Note: if this container sits behind a
    # reverse proxy, configure real_ip so $binary_remote_addr is the true client.
    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=wplogin:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=wpapi:10m   rate=10r/s;
    limit_req_zone $binary_remote_addr zone=wpgeneral:10m rate=10r/s;

    # Block well-known scanners / malicious bots by User-Agent.
    # (Deliberately does NOT block generic curl/wget so health checks keep working.)
    map $http_user_agent $block_ua {
        default 0;
        "~*(sqlmap|nikto|nmap|masscan|zgrab|dirbuster|gobuster|wfuzz|ffuf|nuclei|wpscan|acunetix|nessus|openvas|hydra|metasploit|havij|w3af|arachni|skipfish|whatweb|joomlascanner|python-requests|go-http-client)" 1;
    }

    # maximum file upload size
    # update 'upload_max_filesize' & 'post_max_size' in /etc/php5/fpm/php.ini accordingly
    client_max_body_size 32m;
    # client_body_timeout 60s; # increase for very long file uploads

    # set default index file (can be overwritten for each site individually)
    index index.html;

    # load MIME types
    include mime.types; # get this file from https://github.com/h5bp/server-configs-nginx
    default_type application/octet-stream; # set default MIME type

    # logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # turn on gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Security response headers (applied to all responses that don't override them)
    # disable content type sniffing for more security
    add_header "X-Content-Type-Options" "nosniff" always;
    # prevent clickjacking
    add_header "X-Frame-Options" "SAMEORIGIN" always;
    # limit information leakage via the Referer header
    add_header "Referrer-Policy" "strict-origin-when-cross-origin" always;
    # restrict powerful browser features
    add_header "Permissions-Policy" "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    # (HSTS is intentionally NOT set here: this container serves plain HTTP on :80
    # and TLS is terminated at the reverse proxy, which should send Strict-Transport-Security.)

    # include virtual host configs
    include sites-enabled/*;
}